<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Z-Zone Online 2.5D</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e1e;
            font-family: 'Arial', sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* Кнопка поворота камеры на 90 градусов */
        #rotate-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 100;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 2px solid #ff9900;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        #rotate-btn:active {
            transform: scale(0.9) rotate(90deg);
            background: #ff9900;
        }

        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 40px;
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 10;
            pointer-events: none;
        }
        #joystick-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .hidden { display: none !important; }
        #craft-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #ff9900;
            border-radius: 8px;
            padding: 15px;
            color: white;
            z-index: 100;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="rotate-btn">🔄</div>

    <canvas id="gameCanvas"></canvas>

    <div id="joystick-zone">
        <div id="joystick-center"></div>
    </div>

    <div id="craft-menu" class="hidden">
        <h3>Верстак Ali Style</h3>
        <p>Ресурсы проверяются...</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
