<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Z-Zone Online</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

    <div id="turn-screen">
        <div class="turn-message">🔄 Пожалуйста, переверните устройство в горизонтальный режим!</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud-bar-container">
            <div id="hp-bar" class="hud-bar">HP: 100</div>
        </div>
        <button id="craft-btn" onclick="toggleCraftMenu()">Крафт / Инвентарь</button>
    </div>

    <div id="craft-menu" class="hidden">
        <h3>Доступные крафты</h3>
        <div id="recipes-list">
            <div class="recipe-item">
                <span>Дубина (5 Дерева)</span>
                <button onclick="sendCraft('wood_club')">Скрафтить</button>
            </div>
        </div>
        <button onclick="toggleCraftMenu()" class="close-btn">Закрыть</button>
    </div>

    <div id="joystick-zone"></div>

    <script src="app.js"></script>
</body>
</html>
